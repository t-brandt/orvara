###############################################
# HOW TO
# 1. Put raw Gaia NSS values for ONE star below.
# 2. corr_vec: 21 numbers (npar=7) or 36 (npar=9).
# 3. Run:
#       python gaia_accel_gen_fit.py gaia_accel_prep.ini
# 4. Use OUTPUT_FITS as HGCAFile and hip_id as HipID in orvara.
###############################################


[paths]
# HGCA_vEDR3.fits shipped with orvara (TEMPLATE only)
HGCA_TEMPLATE = HGCA_vEDR3.fits

# Output: 1-star Gaia acceleration file for ORVARA
OUTPUT_FITS = STAR9_gaia_accel.fits


[star]
# Gaia DR3 source_id for this Acceleration9 example star
source_id = 5853498713190525696

# Synthetic Hipparcos ID (choose any unused integer)
hip_id = 200001


[advanced]
# Multiplicative factor applied to Gaia acceleration errors.
# Suggested default from DR3 Astrometry comparison: 2
# Set to 1 to use raw Gaia DR3 errors with no inflation.
error_inflation_factor = 2


[gaia_solution]
# Number of Gaia NSS astrometric parameters:
#   7 → Acceleration7:  ra, dec, parallax, pmra, pmdec, accra, accdec
#   9 → Acceleration9:  Acceleration7 + deriv_accra, deriv_accdec
npar = 9

# Gaia astrometric solution
ra       = 269.0413881143
ra_err   = 0.0152122

dec      = -28.0039448549
dec_err  = 0.0135668

parallax      = 18.43140417
parallax_err  = 0.0207731

pmra      = -44.31829966
pmra_err  = 0.0226331

pmdec     = -9.04345766
pmdec_err = 0.0198277

rv        = 14.2337
rv_err    = 1.3402
rv_source = Gaia_DR3

# Gaia NSS astrometric acceleration solution
accra      = -0.61327475
accra_err  = 0.0319188

accdec     = 0.94122072
accdec_err = 0.0281246

# additional terms ONLY for npar=9 (Acceleration9)
deriv_accra      = -0.01384330
deriv_accra_err  = 0.0040722

deriv_accdec     = 0.02039483
deriv_accdec_err = 0.0035189

# Gaia DR3 CORR_VEC: must be 21 terms for npar=7 and must be 36 terms for npar=9
corr_vec = -0.19292738, 0.09028373, 0.08374236, -0.14495174, -0.07722661, -0.13190042, 0.00497280, -0.04315583, 0.01730011, -0.23388269, -0.19410343, 0.21644189, -0.08893542, 0.11944666, 0.05429111, -0.07082852, 0.04322849, 0.06273738, 0.03144922, -0.20382274, 0.00945512, -0.12840877, -0.20783933, 0.27782470, 0.05017943, -0.04822200, 0.08467947, -0.06528091, -0.13211838, 0.09003822, 0.03438884, -0.02299011, -0.08933702, 0.12877341, -0.07739255, 0.03009121
