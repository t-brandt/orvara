# ==========================================================================
# orvara configuration -- orbit fit against the full HGCA
# Written by `orvara-config --template fit`.
# Validate it any time with `orvara-config --check <thisfile>`.
# ==========================================================================

[data_paths]
# Hipparcos ID of the star.  For a Gaia-only NSS source this is the synthetic
# ID you chose in [gaia_accel] hip_id.
HipID =
# Absolute astrometry.  Either a full HGCA catalogue (HGCA_vEDR3.fits) or the
# one-star file written by `orvara-gaia-accel`.
HGCAFile =
# Radial velocity time series: JD  RV[m/s]  RV_err[m/s]  [instrument index]
RVFile =
# Relative astrometry: epoch  sep  sep_err  PA[deg]  PA_err  [corr]  [planet]
AstrometryFile =
# Relative RV, if you have it.
relRVFile =
# Epoch astrometry directories.  Only needed when use_epoch_astrometry = True.
GaiaDataDir =
Hip1DataDir =
Hip2DataDir =
# Initial conditions for the orbit.  Set to None for the default guess.
start_file = None

[mcmc_settings]
# Number of temperatures in the parallel-tempering chain.
ntemps = 20
# Number of walkers; each walker has ntemps chains.
nwalkers = 100
# Number of companions to fit.
nplanets = 1
# Steps per chain.
nstep = 200000
# emcee's built-in parallelism is poor; 1 is usually fastest.
nthreads = 1
# Keep every thin-th step.
thin = 200
# One RV jitter per instrument instead of one shared jitter.
jit_per_inst = False
# Fit the Hipparcos/Gaia intermediate astrometry with htof.  Requires the three
# data directories above.  Leave False to use the catalogue-level solution.
use_epoch_astrometry = False

[priors_settings]
# Prior on the primary mass (solar masses).  Leave blank for no prior.
mpri =
mpri_sig =
minjitter = 1e-3
maxjitter = 100
# Parallax prior (mas).  Required only when no absolute astrometry is loaded.
parallax =
parallax_error =
# Optional per-companion secondary-mass priors:
#m_secondary0 = 0.001
#m_secondary0_sig = 0.1

[secondary_gaia]
# Set companion_ID to a nonnegative number matching the companion's ID in the
# relative astrometry file if the secondary is itself resolved in Gaia.
# A negative number ignores the rest of this section.
companion_ID = -1
pmra = 0
pmdec = 0
epmra = 0
epmdec = 0
corr_pmra_pmdec = 0

[plotting]
# Chain file produced by fit_orbit.
McmcDataFile =
target =
check_convergence = True
burnin = 500
iplanet = 0
start_epoch = 1985.
end_epoch = 2030.
num_orbits = 100
num_steps = 1500
predicted_years = 2006,2010,2014,2018,2022
position_predict = 2026

Astrometry_orbits_plot = True
Astrometric_prediction_plot = True
RV_orbits_plot = True
RV_plot = True
RV_Instrument = All
Relative_separation_plot = True
Position_angle_plot = True
Proper_motion_plot = True
Proper_motion_separate_plots = False
Corner_plot = True

# --- advanced plotting ---
set_limit = False
xlim = 1955, 2063
ylim = -2.8, 2.8
marker_color = blue
use_colorbar = True
colormap = viridis
reference = msec_solar
show_title = False
add_text = False
text_name =
x_text = 0.5
y_text = 0.9

[save_results]
# median and 1 sigma = 0.16, 0.5, 0.84;  median and 2 sigma = 0.025, 0.5, 0.975
save_params = True
err_margin = 0.16, 0.5, 0.84
